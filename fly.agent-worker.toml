app = "cloud-superbrain-agent-worker"
primary_region = "fra"

# Background queue consumer (no public HTTP service). Runs `python -m app.worker`.
#
# Secrets — set BEFORE deploy (contain credentials, never commit):
#   flyctl secrets set -a cloud-superbrain-agent-worker \
#     DATABASE_URL="postgresql://USER:PASS@HOST:5432/DB" \
#     REDIS_URL="redis://HOST:6379/0"
#
# Source builds use the repository root; the Dockerfile COPY paths are
# repository-root relative.

[build]
  dockerfile = "services/agent-worker/Dockerfile"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  PYTHONUNBUFFERED = "1"
  # DATABASE_URL and REDIS_URL are provided via `flyctl secrets set` (see header).
