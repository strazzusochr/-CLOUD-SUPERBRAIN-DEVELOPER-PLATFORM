name: pr-check

on:
  workflow_call:
  pull_request:
    branches: [chore/repo-bootstrap]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Docker Compose config
        run: docker compose -f docker-compose.dev.yml config >/tmp/compose.yml

      - name: Forbid patched-plan drift in compose
        run: |
          if grep -Eiq 'qdrant|CPX51|Supabase|:latest' docker-compose.dev.yml; then
            echo 'Forbidden Phase-1 drift term found in docker-compose.dev.yml'
            exit 1
          fi

      - name: Python syntax
        run: python -m py_compile services/agent-api/app/main.py services/mcp-gateway/app/main.py

      - name: Phase 5 credit itemization
        run: python scripts/verify_phase5_credit_itemization.py

      - name: Frontend install
        working-directory: apps/frontend
        run: npm ci

      - name: Frontend audit
        working-directory: apps/frontend
        run: npm audit --audit-level=moderate

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Secret scan
        run: gitleaks detect --source . --redact --no-banner --exit-code 1

      - name: Build Phase 1 images
        run: docker compose -f docker-compose.dev.yml build
