name: main-deploy

on:
  push:
    branches: [chore/repo-bootstrap]
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: Target environment marker for the image tag
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}/cloud-superbrain-developer-platform

concurrency:
  group: main-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/pr-check.yml

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: agent-api
            context: services/agent-api
          - name: mcp-gateway
            context: services/mcp-gateway
          - name: frontend
            context: apps/frontend
          - name: llm-gateway
            context: services/llm-gateway
          - name: agent-worker
            context: services/agent-worker
          - name: memory-worker
            context: services/memory-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}:${{ github.event.inputs.deploy_environment || 'staging' }}

  production-gate:
    if: ${{ github.event.inputs.deploy_environment == 'production' }}
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Production approval marker
        run: echo 'Production image tags are published after environment approval. Watchtower/host deployment remains pull-based.'
