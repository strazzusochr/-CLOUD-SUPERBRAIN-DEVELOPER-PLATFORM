name: main-deploy

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact runtime candidate SHA from tracked source qualification truth
        required: true
        type: string

# Read-only by default. Only publish-candidate can mutate GHCR.
permissions:
  contents: read

env:
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}/cloud-superbrain-developer-platform
  TRIVY_VERSION: "0.72.0"
  TRIVY_LINUX_AMD64_SHA256: bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea
  TRIVY_LINUX_AMD64_BINARY_SHA256: 0e69edd134a3c338baa1a6806920773615d682b18cbc6a0cba2a3b658ef9b63e
  TRIVY_DOWNLOAD_URL: https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz

concurrency:
  group: ghcr-candidate-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  candidate-preflight:
    name: Bind control SHA to tracked candidate truth
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      control_sha: ${{ steps.validate.outputs.control_sha }}
      candidate_sha: ${{ steps.validate.outputs.candidate_sha }}
    steps:
      - name: Checkout control commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate control branch and active candidate
        id: validate
        shell: python
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CONTROL_SHA: ${{ github.sha }}
          CONTROL_REF: ${{ github.ref }}
        run: |
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess

          candidate_sha = os.environ["CANDIDATE_SHA"]
          control_sha = os.environ["CONTROL_SHA"]
          control_ref = os.environ["CONTROL_REF"]
          truth_path = pathlib.Path("docs/runtime-state/source-qualification-control.json")
          capability_path = pathlib.Path("docs/runtime-state/capability-gates.json")

          if control_ref != "refs/heads/chore/repo-bootstrap":
              raise SystemExit("candidate publication must be dispatched from refs/heads/chore/repo-bootstrap")
          if re.fullmatch(r"[0-9a-f]{40}", control_sha) is None:
              raise SystemExit("github.sha is not a lowercase 40-hex control SHA")
          if re.fullmatch(r"[0-9a-f]{40}", candidate_sha) is None:
              raise SystemExit("candidate_sha must be an exact lowercase 40-hex commit")
          if candidate_sha == control_sha:
              raise SystemExit("candidate_sha must remain distinct from the control/workflow SHA")

          subprocess.run(
              ["git", "ls-files", "--error-unmatch", truth_path.as_posix()],
              check=True,
              stdout=subprocess.DEVNULL,
          )
          truth = json.loads(truth_path.read_text(encoding="utf-8"))
          expected_truth_keys = {
              "$schema",
              "contract_version",
              "release_id",
              "runtime_candidate_sha",
              "source_archive_sha256",
              "production_rollout_claimed",
              "percentage_credit_awarded",
              "secret_output",
          }
          if set(truth) != expected_truth_keys:
              raise SystemExit("source qualification control fields are not exact")
          if truth.get("$schema") != "../runtime-contracts/source-qualification-control.schema.json":
              raise SystemExit("source qualification control schema mismatch")
          if truth.get("contract_version") != "source-qualification-control-v1":
              raise SystemExit("source qualification control contract mismatch")
          active_source_sha = truth.get("runtime_candidate_sha")
          if active_source_sha != candidate_sha:
              raise SystemExit("candidate_sha does not equal qualified runtime_candidate_sha")
          if re.fullmatch(
              r"prod-candidate-[0-9]{4}-[0-9]{2}-[0-9]{2}-local-rc[0-9]+",
              str(truth.get("release_id", "")),
          ) is None:
              raise SystemExit("source qualification release ID is invalid")
          if truth.get("production_rollout_claimed") is not False:
              raise SystemExit("source qualification may not claim rollout")
          if truth.get("percentage_credit_awarded") != 0:
              raise SystemExit("source qualification may not award credit")
          if truth.get("secret_output") is not False:
              raise SystemExit("source qualification may not report secret output")
          qualified_archive_sha256 = truth.get("source_archive_sha256")
          if re.fullmatch(r"[0-9a-f]{64}", str(qualified_archive_sha256)) is None:
              raise SystemExit("source qualification archive SHA-256 is invalid")
          archive_process = subprocess.Popen(
              ["git", "archive", "--format=tar", candidate_sha],
              stdout=subprocess.PIPE,
          )
          archive_hasher = hashlib.sha256()
          assert archive_process.stdout is not None
          for archive_chunk in iter(lambda: archive_process.stdout.read(1024 * 1024), b""):
              archive_hasher.update(archive_chunk)
          archive_process.stdout.close()
          if archive_process.wait() != 0 or archive_hasher.hexdigest() != qualified_archive_sha256:
              raise SystemExit("source qualification archive SHA-256 mismatch")

          subprocess.run(
              ["git", "ls-files", "--error-unmatch", capability_path.as_posix()],
              check=True,
              stdout=subprocess.DEVNULL,
          )
          capability = json.loads(capability_path.read_text(encoding="utf-8"))
          if capability.get("contract_version") != "capability-gate-state-v1":
              raise SystemExit("capability gate contract is invalid")
          gates = capability.get("gates")
          registry_gate = gates.get("docker_registry_publish") if isinstance(gates, dict) else None
          if not isinstance(registry_gate, dict):
              raise SystemExit("docker_registry_publish gate is missing")
          if registry_gate.get("owner_granted") is not True:
              raise SystemExit("docker_registry_publish has no exact Owner grant")
          owner_grant_ref = registry_gate.get("owner_grant_ref")
          if not isinstance(owner_grant_ref, str) or not owner_grant_ref.strip():
              raise SystemExit("docker_registry_publish Owner grant reference is missing")
          if registry_gate.get("paid_provider") is not False:
              raise SystemExit("docker_registry_publish violates the zero-card policy")

          checked_out_sha = subprocess.run(
              ["git", "rev-parse", "HEAD"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          if checked_out_sha != control_sha:
              raise SystemExit("checked-out control commit does not equal github.sha")

          subprocess.run(
              ["git", "cat-file", "-e", f"{candidate_sha}^{{commit}}"],
              check=True,
          )
          ancestry = subprocess.run(
              ["git", "merge-base", "--is-ancestor", candidate_sha, control_sha],
              check=False,
          )
          if ancestry.returncode != 0:
              raise SystemExit("active candidate is not an ancestor of the control commit")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"control_sha={control_sha}", file=output)
              print(f"candidate_sha={candidate_sha}", file=output)

  verify-candidate:
    name: Verify exact candidate source
    needs: candidate-preflight
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/pr-check.yml
    with:
      candidate_sha: ${{ needs.candidate-preflight.outputs.candidate_sha }}

  publish-candidate:
    name: Publish immutable ${{ matrix.name }} candidate
    needs: [candidate-preflight, verify-candidate]
    runs-on: ubuntu-latest
    environment:
      name: registry-publication
      deployment: false
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent-api
            context: .
            dockerfile: services/agent-api/Dockerfile
          - name: mcp-gateway
            context: .
            dockerfile: services/mcp-gateway/Dockerfile
          - name: frontend
            context: apps/frontend
            dockerfile: apps/frontend/Dockerfile
          - name: llm-gateway
            context: .
            dockerfile: services/llm-gateway/Dockerfile
          - name: agent-worker
            context: .
            dockerfile: services/agent-worker/Dockerfile
          - name: memory-worker
            context: .
            dockerfile: services/memory-worker/Dockerfile
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.candidate-preflight.outputs.candidate_sha }}
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing candidate tag
        id: registry-check
        shell: bash
        env:
          IMAGE_REF: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}:${{ needs.candidate-preflight.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          set +e
          inspection="$(docker buildx imagetools inspect "${IMAGE_REF}" 2>&1)"
          inspect_status=$?
          set -e

          if [ "${inspect_status}" -eq 0 ]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "Candidate tag already exists; build and push are intentionally skipped."
            exit 0
          fi

          if printf '%s' "${inspection}" | grep -Eiq 'manifest unknown' || \
             printf '%s' "${inspection}" | grep -Fq "${IMAGE_REF}: not found"; then
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "Candidate tag is absent; one initial publication is allowed."
            exit 0
          fi

          printf '%s' "${inspection}" >&2
          echo >&2
          echo "Registry state could not be classified safely; refusing to build or push." >&2
          exit "${inspect_status}"

      - name: Build and push absent candidate tag once
        if: ${{ steps.registry-check.outputs.exists == 'false' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}:${{ needs.candidate-preflight.outputs.candidate_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.candidate-preflight.outputs.candidate_sha }}
            org.opencontainers.image.version=candidate-${{ needs.candidate-preflight.outputs.candidate_sha }}

  verify-candidate-manifest:
    name: Verify six remote images and emit candidate manifest
    needs: [candidate-preflight, publish-candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Checkout control verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.candidate-preflight.outputs.control_sha }}
          fetch-depth: 1

      - name: Login to GHCR read-only
        shell: bash
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_READ_TOKEN}" | docker login ghcr.io --username "${GHCR_ACTOR}" --password-stdin >/dev/null
          docker buildx version

      - name: Prepare exclusive manifest destination
        shell: bash
        env:
          OUT_DIR: ${{ runner.temp }}/ghcr-candidate-manifest
        run: |
          set -euo pipefail
          test ! -e "${OUT_DIR}"
          mkdir "${OUT_DIR}"

      - name: Verify aggregate and write immutable manifest
        env:
          GHCR_IMAGE_NAMESPACE: ${{ env.IMAGE_NAMESPACE }}
          CANDIDATE_SHA: ${{ needs.candidate-preflight.outputs.candidate_sha }}
          CONTROL_SHA: ${{ needs.candidate-preflight.outputs.control_sha }}
          WORKFLOW_CANDIDATE_SHA: ${{ needs.candidate-preflight.outputs.candidate_sha }}
          WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GHCR_RELEASE_MANIFEST: ${{ runner.temp }}/ghcr-candidate-manifest/ghcr-candidate-manifest.json
        run: python scripts/verify_ghcr_candidate.py

      - name: Install checksum-pinned Trivy
        shell: bash
        env:
          TRIVY_BIN_DIR: ${{ runner.temp }}/trivy-bin
          TRIVY_ARCHIVE: ${{ runner.temp }}/trivy_${{ env.TRIVY_VERSION }}_Linux-64bit.tar.gz
        run: |
          set -euo pipefail
          test ! -e "${TRIVY_BIN_DIR}"
          mkdir "${TRIVY_BIN_DIR}"
          curl --fail --silent --show-error --location \
            --output "${TRIVY_ARCHIVE}" \
            "${TRIVY_DOWNLOAD_URL}"
          printf '%s  %s\n' "${TRIVY_LINUX_AMD64_SHA256}" "${TRIVY_ARCHIVE}" | sha256sum --check --strict
          tar --extract --gzip --file "${TRIVY_ARCHIVE}" --directory "${TRIVY_BIN_DIR}" trivy
          test "$(sha256sum "${TRIVY_BIN_DIR}/trivy" | cut -d ' ' -f 1)" = "${TRIVY_LINUX_AMD64_BINARY_SHA256}"
          "${TRIVY_BIN_DIR}/trivy" --version | grep -Fx "Version: ${TRIVY_VERSION}"

      - name: Scan all twelve immutable platform digests with pinned Trivy
        env:
          GHCR_RELEASE_MANIFEST: ${{ runner.temp }}/ghcr-candidate-manifest/ghcr-candidate-manifest.json
          TRIVY_BINARY: ${{ runner.temp }}/trivy-bin/trivy
          TRIVY_REPORTS_DIR: ${{ runner.temp }}/ghcr-candidate-manifest/trivy-reports
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
          TRIVY_DB_METADATA: ${{ runner.temp }}/ghcr-candidate-manifest/trivy-db-metadata.json
          GHCR_REMOTE_SCAN_EVIDENCE: ${{ runner.temp }}/ghcr-candidate-manifest/remote-image-scan.json
        run: >-
          python scripts/verify_ghcr_remote_scan.py
          --manifest "${GHCR_RELEASE_MANIFEST}"
          --trivy-binary "${TRIVY_BINARY}"
          --reports-dir "${TRIVY_REPORTS_DIR}"
          --cache-dir "${TRIVY_CACHE_DIR}"
          --db-metadata-output "${TRIVY_DB_METADATA}"
          --output "${GHCR_REMOTE_SCAN_EVIDENCE}"

      - name: Upload immutable candidate manifest
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ghcr-candidate-${{ needs.candidate-preflight.outputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ghcr-candidate-manifest/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Record Actions artifact digest
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test "${ARTIFACT_DIGEST}" != ""
          printf 'Candidate manifest Actions artifact digest: %s' "${ARTIFACT_DIGEST}" >> "${GITHUB_STEP_SUMMARY}"
          echo >> "${GITHUB_STEP_SUMMARY}"

  collect-publication-evidence:
    name: Collect protected registry publication review
    needs: [candidate-preflight, publish-candidate, verify-candidate-manifest]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout control collector
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.candidate-preflight.outputs.control_sha }}
          fetch-depth: 1

      - name: Prepare exclusive collector directories
        shell: bash
        env:
          COLLECTOR_ROOT: ${{ runner.temp }}/ghcr-publication-collector
        run: |
          set -euo pipefail
          test ! -e "${COLLECTOR_ROOT}"
          mkdir "${COLLECTOR_ROOT}"
          mkdir "${COLLECTOR_ROOT}/raw"
          mkdir "${COLLECTOR_ROOT}/download"
          mkdir "${COLLECTOR_ROOT}/receipt"

      - name: Read back run, jobs, review, environment, and artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COLLECTOR_ROOT: ${{ runner.temp }}/ghcr-publication-collector
          ARTIFACT_ID: ${{ needs.verify-candidate-manifest.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.verify-candidate-manifest.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_ID}"
          test -n "${ARTIFACT_DIGEST}"
          api_header='X-GitHub-Api-Version: 2022-11-28'
          gh api -H "${api_header}" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            > "${COLLECTOR_ROOT}/raw/run.json"
          gh api -H "${api_header}" --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            > "${COLLECTOR_ROOT}/raw/jobs.json"
          gh api -H "${api_header}" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/approvals" \
            > "${COLLECTOR_ROOT}/raw/approvals.json"
          gh api -H "${api_header}" \
            "repos/${GITHUB_REPOSITORY}/environments/registry-publication" \
            > "${COLLECTOR_ROOT}/raw/environment.json"
          gh api -H "${api_header}" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" \
            > "${COLLECTOR_ROOT}/raw/artifact.json"
          gh api -H "${api_header}" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "${COLLECTOR_ROOT}/candidate-artifact.zip"
          expected_zip_sha="${ARTIFACT_DIGEST#sha256:}"
          test "${expected_zip_sha}" != "${ARTIFACT_DIGEST}"
          printf '%s  %s\n' "${expected_zip_sha}" "${COLLECTOR_ROOT}/candidate-artifact.zip" | sha256sum --check --strict
          python -m zipfile -e \
            "${COLLECTOR_ROOT}/candidate-artifact.zip" \
            "${COLLECTOR_ROOT}/download"

      - name: Verify protected review and emit registry digest contract
        env:
          COLLECTOR_ROOT: ${{ runner.temp }}/ghcr-publication-collector
          ARTIFACT_ID: ${{ needs.verify-candidate-manifest.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.verify-candidate-manifest.outputs.artifact_digest }}
        run: >-
          python scripts/collect_ghcr_publication_evidence.py
          --manifest "${COLLECTOR_ROOT}/download/ghcr-candidate-manifest.json"
          --remote-scan "${COLLECTOR_ROOT}/download/remote-image-scan.json"
          --run "${COLLECTOR_ROOT}/raw/run.json"
          --jobs "${COLLECTOR_ROOT}/raw/jobs.json"
          --approvals "${COLLECTOR_ROOT}/raw/approvals.json"
          --environment "${COLLECTOR_ROOT}/raw/environment.json"
          --artifact "${COLLECTOR_ROOT}/raw/artifact.json"
          --capability-gates "docs/runtime-state/capability-gates.json"
          --workflow ".github/workflows/main-deploy.yml"
          --expected-artifact-id "${ARTIFACT_ID}"
          --expected-artifact-digest "${ARTIFACT_DIGEST}"
          --publication-output "${COLLECTOR_ROOT}/receipt/registry-publication-review.json"
          --registry-output "${COLLECTOR_ROOT}/receipt/candidate-registry-digests.json"

      - name: Upload immutable protected publication receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ghcr-publication-receipt-${{ needs.candidate-preflight.outputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ghcr-publication-collector/receipt/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false
