name: main-deploy

on:
  push:
    branches: [chore/repo-bootstrap]
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: Target environment marker for the image tag
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}/cloud-superbrain-developer-platform

concurrency:
  group: main-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/pr-check.yml

  production-gate:
    if: ${{ github.event.inputs.deploy_environment == 'production' }}
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Production approval marker
        run: echo 'Production image tags are published after environment approval. Watchtower/host deployment remains pull-based.'

  build-and-push:
    needs: [verify, production-gate]
    if: ${{ always() && needs.verify.result == 'success' && (needs.production-gate.result == 'success' || needs.production-gate.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # agent-api builds from the repo root so it can bake the manifest/
          # state files it reads at runtime (no bind-mounts on Fly).
          - name: agent-api
            context: .
            dockerfile: services/agent-api/Dockerfile
          - name: mcp-gateway
            context: services/mcp-gateway
            dockerfile: services/mcp-gateway/Dockerfile
          - name: frontend
            context: apps/frontend
            dockerfile: apps/frontend/Dockerfile
          - name: llm-gateway
            context: services/llm-gateway
            dockerfile: services/llm-gateway/Dockerfile
          - name: agent-worker
            context: services/agent-worker
            dockerfile: services/agent-worker/Dockerfile
          - name: memory-worker
            context: services/memory-worker
            dockerfile: services/memory-worker/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}:${{ github.event.inputs.deploy_environment || 'staging' }}
