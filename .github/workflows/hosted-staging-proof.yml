name: hosted-staging-proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run hosted staging proof
        shell: pwsh
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: ./scripts/verify-hosted-staging.ps1
