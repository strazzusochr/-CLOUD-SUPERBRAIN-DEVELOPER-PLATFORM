name: phase6-scale-runtime

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact deployed Cloudflare runtime source SHA (S)
        required: true
        type: string
      allow_hosted_writes:
        description: Owner confirms the bounded 800-read/50-create/50-delete zero-card run
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: phase6-scale-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scale-runtime:
    name: Bounded hosted scale evidence
    runs-on: windows-latest
    timeout-minutes: 35
    environment: phase6-scale-hosted-writes
    steps:
      - name: Checkout exact execution-control commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Owner gate and S/C boundary
        id: preflight
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          OWNER_ALLOW_HOSTED_WRITES: ${{ inputs.allow_hosted_writes }}
          WRITE_TOKEN_PRESENT: ${{ secrets.AGENT_API_AUTH_TOKEN != '' }}
          GH_API_TOKEN: ${{ github.token }}
          PHASE6_GITHUB_ENVIRONMENT: phase6-scale-hosted-writes
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:OWNER_ALLOW_HOSTED_WRITES -ne 'true') {
            throw 'Owner did not enable the bounded hosted-write input.'
          }
          if ($env:EXPECTED_SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw 'source_sha must be a lowercase 40-character Git SHA.'
          }
          if ($env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw 'GitHub execution-control SHA is invalid.'
          }
          if ($env:GITHUB_RUN_ATTEMPT -cne '1') {
            throw 'Phase6 scale is one-shot; workflow reruns are forbidden.'
          }
          git cat-file -e "$($env:EXPECTED_SOURCE_SHA)^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Deployed source commit is unavailable.' }
          git merge-base --is-ancestor $env:EXPECTED_SOURCE_SHA $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Deployed source is not an ancestor of the execution-control commit.' }
          $hosted = Get-Content docs/runtime-state/cloudflare-native-hosted-current.json -Raw | ConvertFrom-Json -Depth 30
          $preflight = Get-Content docs/runtime-state/phase6-scale-hosted-current.json -Raw | ConvertFrom-Json -Depth 30
          if ([string]$hosted.contract_version -cne 'cloudflare-native-hosted-current-v1' -or
              [string]$hosted.status -cne 'verified' -or
              $hosted.hosted_proof -ne $true -or
              $hosted.hosted_source_parity_verified -ne $true -or
              $hosted.create_enqueue_queue_do_d1_artifact_roundtrip -ne $true -or
              $hosted.d1_artifact_write_read_delete_verified -ne $true -or
              $hosted.dev_only -ne $false) {
            throw 'Fresh canonical O2Core hosted proof is absent or incomplete.'
          }
          if ([string]$preflight.contract_version -cne 'phase6-scale-hosted-deployment-current-v1' -or
              [string]$preflight.status -cne 'preflight_verified' -or
              $preflight.health_status -ne 200 -or
              $preflight.d1_read_verified -ne $true -or
              $preflight.health_json_source_binding_verified -ne $true -or
              $preflight.preview_guard_verified -ne $true -or
              $preflight.hosted_write_read_delete_verified -ne $false -or
              $preflight.phase6_scale_run_started -ne $false -or
              $preflight.phase6_scale_run_verified -ne $false) {
            throw 'Phase6 deployment preflight is absent, unbound, or falsely claims the not-yet-run scale proof.'
          }
          if ([string]$hosted.source_commit_sha -cne $env:EXPECTED_SOURCE_SHA -or
              [string]$preflight.source_commit_sha -cne $env:EXPECTED_SOURCE_SHA -or
              [string]$hosted.source_archive_sha256 -cne [string]$preflight.source_archive_sha256) {
            throw 'Canonical O2Core, Phase6 preflight, and explicit deployed source do not match.'
          }
          $gates = Get-Content docs/runtime-state/capability-gates.json -Raw | ConvertFrom-Json -Depth 30
          $gate = $gates.gates.phase6_scale_runtime
          if ($gate.owner_granted -ne $true -or [string]::IsNullOrWhiteSpace([string]$gate.owner_grant_ref)) {
            throw 'Canonical phase6_scale_runtime Owner grant is absent.'
          }
          if ($gate.paid_provider -ne $false) { throw 'Phase6 scale gate is not zero-card.' }
          if ($gate.live_verified -ne $false -or
              -not [string]::IsNullOrEmpty([string]$gate.evidence_artifact) -or
              -not [string]::IsNullOrEmpty([string]$gate.evidence_sha256) -or
              -not [string]::IsNullOrEmpty([string]$gate.verified_at_utc) -or
              -not [string]::IsNullOrEmpty([string]$gate.provider) -or
              -not [string]::IsNullOrEmpty([string]$gate.verifier)) {
            throw 'Phase6 scale gate was already consumed or carries pre-run evidence.'
          }
          if ($env:WRITE_TOKEN_PRESENT -ne 'true') {
            throw 'The protected hosted-write secret is absent; its value is never printed.'
          }
          if ($env:PHASE6_GITHUB_ENVIRONMENT -cne 'phase6-scale-hosted-writes') {
            throw 'The protected GitHub Environment binding is invalid.'
          }
          if ($env:GITHUB_API_URL -cne 'https://api.github.com' -or $env:GITHUB_SERVER_URL -cne 'https://github.com') {
            throw 'The GitHub API/server origins are not trusted.'
          }
          if ([string]::IsNullOrWhiteSpace($env:GH_API_TOKEN)) { throw 'GitHub API token is unavailable.' }
          $handler = [Net.Http.HttpClientHandler]::new()
          $handler.AllowAutoRedirect = $false
          $client = [Net.Http.HttpClient]::new($handler)
          try {
            $client.Timeout = [TimeSpan]::FromSeconds(20)
            $client.DefaultRequestHeaders.Accept.ParseAdd('application/vnd.github+json')
            $client.DefaultRequestHeaders.Add('X-GitHub-Api-Version', '2022-11-28')
            $client.DefaultRequestHeaders.UserAgent.ParseAdd('cloud-superbrain-phase6-one-shot/1.0')
            $client.DefaultRequestHeaders.Authorization = [Net.Http.Headers.AuthenticationHeaderValue]::new('Bearer', $env:GH_API_TOKEN)
            $querySha = [Uri]::EscapeDataString($env:GITHUB_SHA)
            $runsUri = "$($env:GITHUB_API_URL)/repos/$($env:GITHUB_REPOSITORY)/actions/workflows/phase6-scale-runtime.yml/runs?event=workflow_dispatch&head_sha=$querySha&per_page=100"
            $runsResponse = $client.GetAsync($runsUri).GetAwaiter().GetResult()
            try {
              if ([int]$runsResponse.StatusCode -ne 200) { throw "GitHub one-shot read failed with HTTP $([int]$runsResponse.StatusCode)." }
              $runsRaw = $runsResponse.Content.ReadAsStringAsync().GetAwaiter().GetResult()
              if ($runsRaw.Length -gt 1048576) { throw 'GitHub one-shot read exceeded the response-size cap.' }
              $runs = $runsRaw | ConvertFrom-Json -Depth 20
            } finally {
              $runsResponse.Dispose()
            }
            $approvalsUri = "$($env:GITHUB_API_URL)/repos/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:GITHUB_RUN_ID)/approvals"
            $approvalsResponse = $client.GetAsync($approvalsUri).GetAwaiter().GetResult()
            try {
              if ([int]$approvalsResponse.StatusCode -ne 200) { throw "GitHub Environment-review read failed with HTTP $([int]$approvalsResponse.StatusCode)." }
              $approvalsRaw = $approvalsResponse.Content.ReadAsStringAsync().GetAwaiter().GetResult()
              if ($approvalsRaw.Length -gt 1048576) { throw 'GitHub Environment-review read exceeded the response-size cap.' }
              $approvalHistory = @($approvalsRaw | ConvertFrom-Json -Depth 20)
            } finally {
              $approvalsResponse.Dispose()
            }
          } finally {
            $client.Dispose()
            $handler.Dispose()
            Remove-Item Env:GH_API_TOKEN -ErrorAction SilentlyContinue
          }
          $matchingRuns = @($runs.workflow_runs | Where-Object {
            [string]$_.head_sha -ceq $env:GITHUB_SHA -and [string]$_.event -ceq 'workflow_dispatch'
          })
          if ([int64]$runs.total_count -ne 1 -or $matchingRuns.Count -ne 1 -or [string]$matchingRuns[0].id -cne $env:GITHUB_RUN_ID) {
            throw 'Phase6 one-shot guard found a rerun or another dispatch for this execution-control SHA.'
          }
          $environmentReviews = @($approvalHistory | Where-Object {
            $reviewEnvironments = @($_.environments)
            $reviewEnvironments.Count -eq 1 -and [string]$reviewEnvironments[0].name -ceq $env:PHASE6_GITHUB_ENVIRONMENT
          })
          if ($environmentReviews.Count -ne 1 -or [string]$environmentReviews[0].state -cne 'approved') {
            throw 'Exactly one approved human review for the protected Phase6 Environment is required.'
          }
          $environmentReview = $environmentReviews[0]
          $environment = @($environmentReview.environments)[0]
          [long]$environmentId = 0
          [long]$reviewerId = 0
          if (-not [long]::TryParse([string]$environment.id, [ref]$environmentId) -or $environmentId -le 0) {
            throw 'The reviewed GitHub Environment ID is invalid.'
          }
          if (-not [long]::TryParse([string]$environmentReview.user.id, [ref]$reviewerId) -or $reviewerId -le 0 -or
              [string]$environmentReview.user.type -cne 'User' -or
              [string]$environmentReview.user.login -cnotmatch '^[A-Za-z0-9](?:[A-Za-z0-9-]{0,38})$' -or
              [string]$environmentReview.user.login -match '(?i)\[bot\]$') {
            throw 'The protected Environment review is not bound to a human GitHub user.'
          }
          foreach ($actorValue in @([string]$env:GITHUB_ACTOR, [string]$env:GITHUB_TRIGGERING_ACTOR)) {
            if ($actorValue -cnotmatch '^[A-Za-z0-9](?:[A-Za-z0-9-]{0,38})$') { throw 'GitHub actor identity is invalid.' }
          }
          $reviewCapturedAt = [DateTimeOffset]::UtcNow
          $reviewArtifactRoot = Join-Path $env:GITHUB_WORKSPACE '.phase1-artifacts\phase6-scale'
          New-Item -ItemType Directory -Force -Path $reviewArtifactRoot | Out-Null
          $reviewPath = Join-Path $reviewArtifactRoot "environment-review-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT).json"
          $reviewSidecarPath = "$reviewPath.sha256"
          if ((Test-Path -LiteralPath $reviewPath) -or (Test-Path -LiteralPath $reviewSidecarPath)) {
            throw 'The immutable Environment-review pair already exists.'
          }
          $sanitizedReview = [ordered]@{
            contract_version = 'github-actions-phase6-environment-review-v1'
            captured_at_utc = $reviewCapturedAt.ToString('o')
            repository = [string]$env:GITHUB_REPOSITORY
            run_id = [long]$env:GITHUB_RUN_ID
            run_attempt = [int]$env:GITHUB_RUN_ATTEMPT
            head_sha = [string]$env:GITHUB_SHA
            environment_name = [string]$environment.name
            environment_id = $environmentId
            review_state = [string]$environmentReview.state
            reviewer_login = [string]$environmentReview.user.login
            reviewer_id = $reviewerId
            reviewer_type = [string]$environmentReview.user.type
            actor_login = [string]$env:GITHUB_ACTOR
            triggering_actor_login = [string]$env:GITHUB_TRIGGERING_ACTOR
            secret_output = $false
          }
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          $reviewBytes = $utf8NoBom.GetBytes((($sanitizedReview | ConvertTo-Json -Depth 10) + "`n"))
          $sha = [Security.Cryptography.SHA256]::Create()
          try { $reviewSha256 = (($sha.ComputeHash($reviewBytes) | ForEach-Object { $_.ToString('x2') }) -join '') }
          finally { $sha.Dispose() }
          $reviewSidecarBytes = $utf8NoBom.GetBytes("$reviewSha256  $([IO.Path]::GetFileName($reviewPath))`n")
          $sidecarCreated = $false
          $reviewCreated = $false
          try {
            $stream = [IO.File]::Open($reviewSidecarPath, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::Read)
            try { $stream.Write($reviewSidecarBytes, 0, $reviewSidecarBytes.Length) } finally { $stream.Dispose() }
            $sidecarCreated = $true
            $stream = [IO.File]::Open($reviewPath, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::Read)
            try { $stream.Write($reviewBytes, 0, $reviewBytes.Length) } finally { $stream.Dispose() }
            $reviewCreated = $true
          } catch {
            if ($reviewCreated -and (Test-Path -LiteralPath $reviewPath)) { Remove-Item -LiteralPath $reviewPath -Force }
            if ($sidecarCreated -and (Test-Path -LiteralPath $reviewSidecarPath)) { Remove-Item -LiteralPath $reviewSidecarPath -Force }
            throw
          }
          "environment_review_path=$reviewPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "environment_review_sidecar_path=$reviewSidecarPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host '[phase6-scale-workflow] owner_gate=true source_control_boundary=true one_shot=true environment_review=true token_present=true token_output=false'

      - name: Execute bounded Phase6 scale proof
        id: scale-proof
        shell: pwsh
        env:
          AGENT_API_AUTH_TOKEN: ${{ secrets.AGENT_API_AUTH_TOKEN }}
          PHASE6_GITHUB_ENVIRONMENT: phase6-scale-hosted-writes
          PHASE6_ENVIRONMENT_REVIEW_PATH: ${{ steps.preflight.outputs.environment_review_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE '.phase1-artifacts\phase6-scale'
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          $before = @(
            Get-ChildItem -LiteralPath $artifactRoot -Filter 'scale-evidence-*.json' -File -ErrorAction SilentlyContinue |
              ForEach-Object { $_.FullName }
          )
          & pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/verify-phase6-scale-runtime.ps1 -AllowHostedWrites
          if ($LASTEXITCODE -ne 0) { throw "Phase6 scale runtime verifier failed with exit $LASTEXITCODE." }
          $after = @(
            Get-ChildItem -LiteralPath $artifactRoot -Filter 'scale-evidence-*.json' -File |
              ForEach-Object { $_.FullName }
          )
          $created = @($after | Where-Object { $before -cnotcontains $_ })
          if ($created.Count -ne 1) { throw 'Runtime verifier did not create exactly one immutable evidence report.' }
          $evidencePath = $created[0]
          $sidecarPath = "$evidencePath.sha256"
          if (-not (Test-Path -LiteralPath $sidecarPath -PathType Leaf)) {
            throw 'Runtime verifier did not create the digest sidecar.'
          }
          "evidence_path=$evidencePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sidecar_path=$sidecarPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host '[phase6-scale-workflow] provisional_evidence=true promotion=false registry_write=false production_deploy=false secret_output=false'

      - name: Upload immutable provisional evidence pair
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase6-scale-execution-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.scale-proof.outputs.evidence_path }}
            ${{ steps.scale-proof.outputs.sidecar_path }}
            ${{ steps.preflight.outputs.environment_review_path }}
            ${{ steps.preflight.outputs.environment_review_sidecar_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: false
