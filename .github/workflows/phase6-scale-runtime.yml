name: phase6-scale-runtime

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact deployed Cloudflare runtime source SHA (S)
        required: true
        type: string
      allow_hosted_writes:
        description: Owner confirms the bounded 800-read/50-create/50-delete zero-card run
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: phase6-scale-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scale-runtime:
    name: Bounded hosted scale evidence
    runs-on: windows-latest
    timeout-minutes: 35
    environment: phase6-scale-hosted-writes
    steps:
      - name: Checkout exact execution-control commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Owner gate and S/C boundary
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          OWNER_ALLOW_HOSTED_WRITES: ${{ inputs.allow_hosted_writes }}
          WRITE_TOKEN_PRESENT: ${{ secrets.AGENT_API_AUTH_TOKEN != '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:OWNER_ALLOW_HOSTED_WRITES -ne 'true') {
            throw 'Owner did not enable the bounded hosted-write input.'
          }
          if ($env:EXPECTED_SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw 'source_sha must be a lowercase 40-character Git SHA.'
          }
          if ($env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw 'GitHub execution-control SHA is invalid.'
          }
          git cat-file -e "$($env:EXPECTED_SOURCE_SHA)^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Deployed source commit is unavailable.' }
          git merge-base --is-ancestor $env:EXPECTED_SOURCE_SHA $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Deployed source is not an ancestor of the execution-control commit.' }
          $hosted = Get-Content docs/runtime-state/cloudflare-native-hosted-current.json -Raw | ConvertFrom-Json -Depth 30
          if ([string]$hosted.source_commit_sha -cne $env:EXPECTED_SOURCE_SHA) {
            throw 'Hosted-state source does not equal the explicit deployed source input.'
          }
          $gates = Get-Content docs/runtime-state/capability-gates.json -Raw | ConvertFrom-Json -Depth 30
          $gate = $gates.gates.phase6_scale_runtime
          if ($gate.owner_granted -ne $true -or [string]::IsNullOrWhiteSpace([string]$gate.owner_grant_ref)) {
            throw 'Canonical phase6_scale_runtime Owner grant is absent.'
          }
          if ($gate.paid_provider -ne $false) { throw 'Phase6 scale gate is not zero-card.' }
          if ($env:WRITE_TOKEN_PRESENT -ne 'true') {
            throw 'The protected hosted-write secret is absent; its value is never printed.'
          }
          Write-Host '[phase6-scale-workflow] owner_gate=true source_control_boundary=true token_present=true token_output=false'

      - name: Execute bounded Phase6 scale proof
        id: scale-proof
        shell: pwsh
        env:
          AGENT_API_AUTH_TOKEN: ${{ secrets.AGENT_API_AUTH_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE '.phase1-artifacts\phase6-scale'
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          $before = @(
            Get-ChildItem -LiteralPath $artifactRoot -Filter 'scale-evidence-*.json' -File -ErrorAction SilentlyContinue |
              ForEach-Object { $_.FullName }
          )
          & pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/verify-phase6-scale-runtime.ps1 -AllowHostedWrites
          if ($LASTEXITCODE -ne 0) { throw "Phase6 scale runtime verifier failed with exit $LASTEXITCODE." }
          $after = @(
            Get-ChildItem -LiteralPath $artifactRoot -Filter 'scale-evidence-*.json' -File |
              ForEach-Object { $_.FullName }
          )
          $created = @($after | Where-Object { $before -cnotcontains $_ })
          if ($created.Count -ne 1) { throw 'Runtime verifier did not create exactly one immutable evidence report.' }
          $evidencePath = $created[0]
          $sidecarPath = "$evidencePath.sha256"
          if (-not (Test-Path -LiteralPath $sidecarPath -PathType Leaf)) {
            throw 'Runtime verifier did not create the digest sidecar.'
          }
          "evidence_path=$evidencePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sidecar_path=$sidecarPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host '[phase6-scale-workflow] provisional_evidence=true promotion=false registry_write=false production_deploy=false secret_output=false'

      - name: Upload immutable provisional evidence pair
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase6-scale-execution-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.scale-proof.outputs.evidence_path }}
            ${{ steps.scale-proof.outputs.sidecar_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: false
