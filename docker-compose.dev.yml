name: cloud-superbrain-phase1-dev

services:
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      target: dev-runner
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_AGENT_API_URL: /api
      AGENT_API_INTERNAL_URL: http://agent-api:8000
      AGENT_API_AUTH_TOKEN: ${AGENT_API_AUTH_TOKEN:-}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      LLM_GATEWAY_BASE_URL: http://llm-gateway:4000
      MCP_GATEWAY_BASE_URL: http://mcp-gateway:9000
      SUPERBRAIN_RUNTIME_MODE: "dev-only"
      WORKBENCH_LLM_MODEL: ${WORKBENCH_LLM_MODEL:-gemma-3-1b-it}
      PRODUCT_ACCEPTANCE_LIVE_PROVIDER_APPROVED: ${PRODUCT_ACCEPTANCE_LIVE_PROVIDER_APPROVED:-false}
      O4_LIVE_WRITE_PROBE_ENABLED: "true"
      EVIDENCE_DIR: /workspace/evidence
      WATCHPACK_POLLING: "true"
    expose:
      - "3000"
    volumes:
      - ./apps/frontend/app:/app/app:ro
      - ./apps/frontend/components:/app/components:ro
      - ./apps/frontend/lib:/app/lib:ro
      - ./apps/frontend/next.config.mjs:/app/next.config.mjs:ro
      - ./apps/frontend/next-env.d.ts:/app/next-env.d.ts
      - ./apps/frontend/tsconfig.json:/app/tsconfig.json
      - ./.codex/runs/CURRENT/endziel:/workspace/evidence
    depends_on:
      agent-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 15s
      retries: 10
    mem_limit: 2048m
    cpus: "1.25"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next:uid=10001,gid=10001,mode=1777
    networks:
      - platform

  agent-api:
    build:
      # Root context so the Dockerfile can bake the manifest/state files
      # (matches .github/workflows/main-deploy.yml).
      context: .
      dockerfile: services/agent-api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-superbrain}:${POSTGRES_PASSWORD:-change-me-now}@postgres:5432/${POSTGRES_DB:-superbrain_prod}
      AGENT_API_AUTH_TOKEN: ${AGENT_API_AUTH_TOKEN:-}
      SUPERBRAIN_RUNTIME_MODE: "dev-only"
      # O1 / production_auth_identity: die Agent API berechnet `github_oauth_configured`
      # und `credential_issuance_ready` ausschliesslich aus diesen vier Werten
      # (services/agent-api/app/main.py:2285). Ohne Verdrahtung bleibt Auth dauerhaft
      # fail-closed, unabhaengig davon was in der Secrets-Datei oder bei Vercel steht.
      # Standard ist bewusst leer: kein Wert -> kein Credential-Issuance.
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_REDIRECT_URI: ${GITHUB_OAUTH_REDIRECT_URI:-}
      GITHUB_OAUTH_OWNER_IDS: ${GITHUB_OAUTH_OWNER_IDS:-}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:-}
      REDIS_URL: redis://redis:6379/0
      MCP_GATEWAY_URL: http://mcp-gateway:9000
      LLM_GATEWAY_URL: http://llm-gateway:4000
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      WORKING_MEMORY_TTL_SECONDS: ${WORKING_MEMORY_TTL_SECONDS:-1800}
      MEMORY_CONSOLIDATION_INTERVAL_SECONDS: ${MEMORY_CONSOLIDATION_INTERVAL_SECONDS:-300}
      MEMORY_CONSOLIDATION_TTL_THRESHOLD_SECONDS: ${MEMORY_CONSOLIDATION_TTL_THRESHOLD_SECONDS:-480}
      LLM_BUDGET_LIMIT_CENTS: ${LLM_BUDGET_LIMIT_CENTS:-20000}
      LLM_BUDGET_WARNING_PERCENTAGE: ${LLM_BUDGET_WARNING_PERCENTAGE:-80}
      MAX_LLM_CALLS_PER_SESSION: ${MAX_LLM_CALLS_PER_SESSION:-50}
      PROMPT_RATE_LIMIT_CAPACITY: ${PROMPT_RATE_LIMIT_CAPACITY:-20}
      PROMPT_RATE_LIMIT_WINDOW_SECONDS: ${PROMPT_RATE_LIMIT_WINDOW_SECONDS:-3600}
      PROJECT_PROGRESS_MANIFEST_PATH: /app/progress/project-progress.manifest.json
      EXTERNAL_GATE_SUMMARY_PATH: /app/progress/external-gate-summary.json
      CAPABILITY_GATE_STATE_PATH: /app/progress/capability-gates.json
      O4_LIVE_WRITE_PROBE_ENABLED: "true"
      O4_OWNER_MANIFEST_PATH: /app/progress/owner-input-manifest.json
      O4_GIT_HEAD_PATH: /app/o4-git/HEAD
      PROJECT_STATE_PATH: /app/PROJECT_STATE.md
      EVIDENCE_DIR: /workspace/evidence
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-gemma-3-1b-it}
      AUTONOMOUS_AGENT_ROSTER_PATH: /app/docs/codex-integration/autonomous-agent-roster.json
      AUTONOMOUS_TEAM_EXTERNAL_PROVIDER: ${AUTONOMOUS_TEAM_EXTERNAL_PROVIDER:-dopiert}
      AUTONOMOUS_TEAM_EXTERNAL_STATUS_URL: ${AUTONOMOUS_TEAM_EXTERNAL_STATUS_URL:-http://host.docker.internal:8000/status}
      AUTONOMOUS_TEAM_EXTERNAL_AGENTS_URL: ${AUTONOMOUS_TEAM_EXTERNAL_AGENTS_URL:-http://host.docker.internal:8000/agents}
      AUTONOMOUS_TEAM_EXTERNAL_TIMEOUT_SECONDS: ${AUTONOMOUS_TEAM_EXTERNAL_TIMEOUT_SECONDS:-5}
      CLOUD_PROVIDER_INVENTORY_ENABLED: ${CLOUD_PROVIDER_INVENTORY_ENABLED:-true}
      # Historical read-only inventory only; never satisfies an active hosted-runtime gate.
      FLY_API_TOKEN: ${FLY_API_TOKEN:-}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY:-}
      GRAFANA_CLOUD_URL: ${GRAFANA_CLOUD_URL:-}
      STAGING_BASE_URL: ${STAGING_BASE_URL:-}
      BRANCH_PROTECTION_TOKEN: ${BRANCH_PROTECTION_TOKEN:-}
      VERCEL_TOKEN: ${VERCEL_TOKEN:-}
      VERCEL_PROJECT_ID: ${VERCEL_PROJECT_ID:-}
      VERCEL_ORG_ID: ${VERCEL_ORG_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
      CLOUDFLARE_AI_GATEWAY_URL: ${CLOUDFLARE_AI_GATEWAY_URL:-}
      CLOUDFLARE_DASHBOARD_URL: ${CLOUDFLARE_DASHBOARD_URL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-}
      GHCR_TOKEN: ${GHCR_TOKEN:-}
      GHCR_OWNER: ${GHCR_OWNER:-}
      GHCR_PACKAGE: ${GHCR_PACKAGE:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_PROFILE_URL: ${HF_PROFILE_URL:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_PROFILE_URL: ${GITLAB_PROFILE_URL:-}
      GITLAB_API_URL: ${GITLAB_API_URL:-}
    expose:
      - "8000"
    volumes:
      - ./docs/project-progress.manifest.json:/app/progress/project-progress.manifest.json:ro
      - ./docs/runtime-state/external-gate-summary.json:/app/progress/external-gate-summary.json:ro
      - ./docs/runtime-state/capability-gates.json:/app/progress/capability-gates.json:ro
      - ./docs/runtime-state/owner-input-manifest.json:/app/progress/owner-input-manifest.json:ro
      - ./.git/HEAD:/app/o4-git/HEAD:ro
      - ./PROJECT_STATE.md:/app/PROJECT_STATE.md:ro
      - ./docs/codex-integration/autonomous-agent-roster.json:/app/docs/codex-integration/autonomous-agent-roster.json:ro
      - ./services/agent-api/app:/app/app:ro
      - ./.codex/runs/CURRENT/endziel:/workspace/evidence
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-gateway:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=20)"]
      interval: 20s
      timeout: 25s
      start_period: 30s
      retries: 5
    mem_limit: 768m
    cpus: "1.00"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - platform

  agent-worker:
    build:
      context: .
      dockerfile: services/agent-worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-superbrain}:${POSTGRES_PASSWORD:-change-me-now}@postgres:5432/${POSTGRES_DB:-superbrain_prod}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./services/agent-worker/app:/app/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, psycopg, redis; redis.Redis.from_url(os.environ['REDIS_URL'], socket_timeout=2, socket_connect_timeout=2).ping(); psycopg.connect(os.environ['DATABASE_URL'], connect_timeout=2).close()"]
      interval: 20s
      timeout: 20s
      retries: 5
    mem_limit: 512m
    cpus: "0.50"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - platform

  memory-worker:
    build:
      context: .
      dockerfile: services/memory-worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-superbrain}:${POSTGRES_PASSWORD:-change-me-now}@postgres:5432/${POSTGRES_DB:-superbrain_prod}
      REDIS_URL: redis://redis:6379/0
      MEMORY_CONSOLIDATION_INTERVAL_SECONDS: ${MEMORY_CONSOLIDATION_INTERVAL_SECONDS:-300}
      MEMORY_CONSOLIDATION_TTL_THRESHOLD_SECONDS: ${MEMORY_CONSOLIDATION_TTL_THRESHOLD_SECONDS:-480}
      WORKING_MEMORY_PATTERN: memory:working:*
    volumes:
      - ./services/memory-worker/app:/app/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 20s
      timeout: 15s
      start_period: 30s
      retries: 5
    mem_limit: 384m
    cpus: "0.35"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - platform

  mcp-gateway:
    build:
      context: .
      dockerfile: services/mcp-gateway/Dockerfile
    restart: unless-stopped
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      E2B_API_KEY: ${E2B_API_KEY:-}
      AGENT_API_AUTH_TOKEN: ${AGENT_API_AUTH_TOKEN:-}
      SUPERBRAIN_RUNTIME_MODE: "dev-only"
      FILESYSTEM_ROOT: /tmp/agent-workspace
      FILESYSTEM_PROJECT_PROGRESS_PATH: /app/readonly/project-progress.manifest.json
      AGENT_API_INTERNAL_URL: http://agent-api:8000
      O4_LIVE_WRITE_PROBE_ENABLED: "true"
      O4_LIVE_WRITE_NEGATIVE_TEST_ENABLED: "true"
      O4_OWNER_MANIFEST_PATH: /app/progress/owner-input-manifest.json
      O4_GIT_HEAD_PATH: /app/o4-git/HEAD
    expose:
      - "9000"
    volumes:
      - ./.phase1-artifacts/o4-live-write-workspace:/tmp/agent-workspace
      - ./docs/runtime-state/owner-input-manifest.json:/app/progress/owner-input-manifest.json:ro
      - ./.git/HEAD:/app/o4-git/HEAD:ro
      - ./services/mcp-gateway/app:/app/app:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/api/v1/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: "0.75"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - platform

  llm-gateway:
    build:
      context: .
      dockerfile: services/llm-gateway/Dockerfile
    restart: unless-stopped
    environment:
      AGENT_API_INTERNAL_URL: http://agent-api:8000
      LLM_GATEWAY_INTERNAL_URL: http://llm-gateway:4000
      MCP_GATEWAY_INTERNAL_URL: http://mcp-gateway:9000
      STAGING_BASE_URL: ${STAGING_BASE_URL:-http://localhost:8081}
      VERCEL_AGENT_API_ORIGIN: ${VERCEL_AGENT_API_ORIGIN:-}
      VERCEL_MCP_GATEWAY_ORIGIN: ${VERCEL_MCP_GATEWAY_ORIGIN:-}
      VERCEL_LLM_GATEWAY_ORIGIN: ${VERCEL_LLM_GATEWAY_ORIGIN:-}
      # Default posture is deterministic dry-run (documented architecture). Local llama.cpp is
      # opt-in on demand: set LLM_GATEWAY_MODE=local_openai_live to run the workbench F1 proof.
      LLM_GATEWAY_MODE: ${LLM_GATEWAY_MODE:-deterministic_dry_run}
      LLM_LIVE_PROVIDER_DEFAULT: ${LLM_LIVE_PROVIDER_DEFAULT:-false}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://local-llm:8080/v1}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-gemma-3-1b-it}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_ROUTER_BASE_URL: ${HF_ROUTER_BASE_URL:-https://router.huggingface.co/v1}
      HF_DEFAULT_CHAT_MODEL: ${HF_DEFAULT_CHAT_MODEL:-deepseek-ai/DeepSeek-V4-Flash:fastest}
      HF_ROUTER_TIMEOUT_SECONDS: ${HF_ROUTER_TIMEOUT_SECONDS:-90}
      ALIBABA_MODEL_STUDIO_BASE_URL: ${ALIBABA_MODEL_STUDIO_BASE_URL:-}
      ALIBABA_MODEL_STUDIO_CODER_MODEL: ${ALIBABA_MODEL_STUDIO_CODER_MODEL:-qwen3.7-plus}
      ALIBABA_MODEL_STUDIO_TIMEOUT_SECONDS: ${ALIBABA_MODEL_STUDIO_TIMEOUT_SECONDS:-90}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CF_WORKERS_AI_TOKEN: ${CF_WORKERS_AI_TOKEN:-}
      CF_WORKERS_AI_BASE_URL: ${CF_WORKERS_AI_BASE_URL:-https://api.cloudflare.com/client/v4}
      CF_WORKERS_AI_TIMEOUT_SECONDS: ${CF_WORKERS_AI_TIMEOUT_SECONDS:-90}
      CF_WORKERS_AI_MAX_TOKENS: ${CF_WORKERS_AI_MAX_TOKENS:-8192}
    expose:
      - "4000"
    volumes:
      - ./services/llm-gateway/app:/app/app:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/api/v1/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 384m
    cpus: "0.50"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - platform

  local-llm:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:4f02c560799a1569be08b0183d52b94b0d4a6e4b88f52f20562d2334c73837d4
    restart: unless-stopped
    command:
      - -hf
      - ggml-org/gemma-3-1b-it-GGUF
      - --alias
      - gemma-3-1b-it
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "4096"
      - --threads
      - "4"
      - --parallel
      - "1"
      - --batch-size
      - "128"
    expose:
      - "8080"
    volumes:
      - local_llm_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    mem_limit: 4096m
    cpus: "2.00"
    networks:
      - platform

  postgres:
    image: pgvector/pgvector:0.8.2-pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-superbrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-now}
      POSTGRES_DB: ${POSTGRES_DB:-superbrain_prod}
      LANGFUSE_DB_NAME: ${LANGFUSE_DB_NAME:-langfuse}
      LANGFUSE_DB_USER: ${LANGFUSE_DB_USER:-langfuse}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD:-change-me-too}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 768m
    cpus: "1.00"
    networks:
      - platform

  redis:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "${REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "allkeys-lru"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 384m
    cpus: "0.50"
    networks:
      - platform

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8081}:8080"
    volumes:
      - ./infrastructure/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      agent-api:
        condition: service_healthy
      mcp-gateway:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    cpus: "0.25"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    networks:
      - platform

networks:
  platform:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mcp_workspace:
  local_llm_cache:
