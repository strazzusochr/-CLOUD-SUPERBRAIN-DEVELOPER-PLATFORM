name: cloud-superbrain-cloud

x-app-runtime: &app-runtime
  restart: unless-stopped
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp
  networks:
    - platform

services:
  frontend:
    <<: *app-runtime
    image: ${GHCR_IMAGE_NAMESPACE:-ghcr.io/strazzusochr/cloud-superbrain-developer-platform}/frontend:${IMAGE_TAG:-staging}
    pull_policy: always
    environment:
      NEXT_PUBLIC_AGENT_API_URL: /api
      AGENT_API_INTERNAL_URL: http://agent-api:8000
    expose:
      - "3000"
    depends_on:
      agent-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: "0.75"

  agent-api:
    <<: *app-runtime
    image: ${GHCR_IMAGE_NAMESPACE:-ghcr.io/strazzusochr/cloud-superbrain-developer-platform}/agent-api:${IMAGE_TAG:-staging}
    pull_policy: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-superbrain}:${POSTGRES_PASSWORD:-change-me-now}@postgres:5432/${POSTGRES_DB:-superbrain_prod}
      REDIS_URL: redis://redis:6379/0
      MCP_GATEWAY_URL: http://mcp-gateway:9000
      LLM_GATEWAY_URL: http://llm-gateway:4000
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_PUBLIC_URL: ${LANGFUSE_PUBLIC_URL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      WORKING_MEMORY_TTL_SECONDS: ${WORKING_MEMORY_TTL_SECONDS:-1800}
      MEMORY_CONSOLIDATION_INTERVAL_SECONDS: ${MEMORY_CONSOLIDATION_INTERVAL_SECONDS:-300}
      MEMORY_CONSOLIDATION_TTL_THRESHOLD_SECONDS: ${MEMORY_CONSOLIDATION_TTL_THRESHOLD_SECONDS:-480}
      LLM_BUDGET_LIMIT_CENTS: ${LLM_BUDGET_LIMIT_CENTS:-20000}
      LLM_BUDGET_WARNING_PERCENTAGE: ${LLM_BUDGET_WARNING_PERCENTAGE:-80}
      MAX_LLM_CALLS_PER_SESSION: ${MAX_LLM_CALLS_PER_SESSION:-50}
      PROMPT_RATE_LIMIT_CAPACITY: ${PROMPT_RATE_LIMIT_CAPACITY:-20}
      PROMPT_RATE_LIMIT_WINDOW_SECONDS: ${PROMPT_RATE_LIMIT_WINDOW_SECONDS:-3600}
      PROJECT_PROGRESS_MANIFEST_PATH: /app/progress/project-progress.manifest.json
      CLOUD_PROVIDER_INVENTORY_ENABLED: ${CLOUD_PROVIDER_INVENTORY_ENABLED:-true}
      HETZNER_API_TOKEN: ${HETZNER_API_TOKEN:-}
      HETZNER_PROJECT_ID: ${HETZNER_PROJECT_ID:-}
      HETZNER_SERVER_ID: ${HETZNER_SERVER_ID:-}
      HETZNER_SERVER_NAME: ${HETZNER_SERVER_NAME:-}
      HETZNER_SERVER_TYPE: ${HETZNER_SERVER_TYPE:-}
      HETZNER_SERVER_LOCATION: ${HETZNER_SERVER_LOCATION:-}
      HETZNER_SERVER_IPV4: ${HETZNER_SERVER_IPV4:-}
      HETZNER_SERVER_IPV6_CIDR: ${HETZNER_SERVER_IPV6_CIDR:-}
      HETZNER_PRIMARY_IPV4_ID: ${HETZNER_PRIMARY_IPV4_ID:-}
      HETZNER_PRIMARY_IPV6_ID: ${HETZNER_PRIMARY_IPV6_ID:-}
      HETZNER_VOLUME_ID: ${HETZNER_VOLUME_ID:-}
      STAGING_BASE_URL: ${STAGING_BASE_URL:-}
      BRANCH_PROTECTION_TOKEN: ${BRANCH_PROTECTION_TOKEN:-}
      VERCEL_TOKEN: ${VERCEL_TOKEN:-}
      VERCEL_PROJECT_ID: ${VERCEL_PROJECT_ID:-}
      VERCEL_ORG_ID: ${VERCEL_ORG_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
      CLOUDFLARE_AI_GATEWAY_URL: ${CLOUDFLARE_AI_GATEWAY_URL:-}
      CLOUDFLARE_DASHBOARD_URL: ${CLOUDFLARE_DASHBOARD_URL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-}
      GHCR_TOKEN: ${GHCR_TOKEN:-}
      GHCR_OWNER: ${GHCR_OWNER:-}
      GHCR_PACKAGE: ${GHCR_PACKAGE:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_PROFILE_URL: ${HF_PROFILE_URL:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_PROFILE_URL: ${GITLAB_PROFILE_URL:-}
      GITLAB_API_URL: ${GITLAB_API_URL:-}
      GITKRAKEN_API_TOKEN: ${GITKRAKEN_API_TOKEN:-}
      GITKRAKEN_ORG_ID: ${GITKRAKEN_ORG_ID:-}
      GITKRAKEN_ORG_NAME: ${GITKRAKEN_ORG_NAME:-}
      GITKRAKEN_DASHBOARD_URL: ${GITKRAKEN_DASHBOARD_URL:-}
      GITKRAKEN_API_URL: ${GITKRAKEN_API_URL:-}
    expose:
      - "8000"
    volumes:
      - ./docs/project-progress.manifest.json:/app/progress/project-progress.manifest.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-gateway:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 768m
    cpus: "1.00"

  agent-worker:
    <<: *app-runtime
    image: ${GHCR_IMAGE_NAMESPACE:-ghcr.io/strazzusochr/cloud-superbrain-developer-platform}/agent-worker:${IMAGE_TAG:-staging}
    pull_policy: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-superbrain}:${POSTGRES_PASSWORD:-change-me-now}@postgres:5432/${POSTGRES_DB:-superbrain_prod}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, psycopg, redis; redis.Redis.from_url(os.environ['REDIS_URL'], socket_timeout=2).ping(); psycopg.connect(os.environ['DATABASE_URL']).close()"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: "0.50"

  memory-worker:
    <<: *app-runtime
    image: ${GHCR_IMAGE_NAMESPACE:-ghcr.io/strazzusochr/cloud-superbrain-developer-platform}/memory-worker:${IMAGE_TAG:-staging}
    pull_policy: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-superbrain}:${POSTGRES_PASSWORD:-change-me-now}@postgres:5432/${POSTGRES_DB:-superbrain_prod}
      REDIS_URL: redis://redis:6379/0
      MEMORY_CONSOLIDATION_INTERVAL_SECONDS: ${MEMORY_CONSOLIDATION_INTERVAL_SECONDS:-300}
      MEMORY_CONSOLIDATION_TTL_THRESHOLD_SECONDS: ${MEMORY_CONSOLIDATION_TTL_THRESHOLD_SECONDS:-480}
      WORKING_MEMORY_PATTERN: memory:working:*
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, psycopg, redis; redis.Redis.from_url(os.environ['REDIS_URL'], socket_timeout=2).ping(); psycopg.connect(os.environ['DATABASE_URL']).close()"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 384m
    cpus: "0.35"

  mcp-gateway:
    <<: *app-runtime
    image: ${GHCR_IMAGE_NAMESPACE:-ghcr.io/strazzusochr/cloud-superbrain-developer-platform}/mcp-gateway:${IMAGE_TAG:-staging}
    pull_policy: always
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      E2B_API_KEY: ${E2B_API_KEY:-}
      FILESYSTEM_ROOT: /tmp/agent-workspace
      AGENT_API_INTERNAL_URL: http://agent-api:8000
    expose:
      - "9000"
    volumes:
      - mcp_workspace:/tmp/agent-workspace
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/api/v1/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: "0.75"

  llm-gateway:
    <<: *app-runtime
    image: ${GHCR_IMAGE_NAMESPACE:-ghcr.io/strazzusochr/cloud-superbrain-developer-platform}/llm-gateway:${IMAGE_TAG:-staging}
    pull_policy: always
    environment:
      AGENT_API_INTERNAL_URL: http://agent-api:8000
      LLM_GATEWAY_MODE: ${LLM_GATEWAY_MODE:-deterministic_dry_run}
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/api/v1/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 384m
    cpus: "0.50"

  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-superbrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-now}
      POSTGRES_DB: ${POSTGRES_DB:-superbrain_prod}
      LANGFUSE_DB_NAME: ${LANGFUSE_DB_NAME:-langfuse}
      LANGFUSE_DB_USER: ${LANGFUSE_DB_USER:-langfuse}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD:-change-me-too}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 768m
    cpus: "1.00"
    networks:
      - platform

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "${REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "allkeys-lru"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 384m
    cpus: "0.50"
    networks:
      - platform

  nginx:
    image: nginx:1.27.4-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/cloud.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      agent-api:
        condition: service_healthy
      mcp-gateway:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    cpus: "0.25"
    networks:
      - platform

networks:
  platform:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mcp_workspace:
