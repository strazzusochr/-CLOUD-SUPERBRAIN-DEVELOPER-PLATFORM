app = "cloud-superbrain-mcp-gateway"
primary_region = "fra"

[build]
  dockerfile = "services/mcp-gateway/Dockerfile"

[http_service]
  internal_port = 9000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    method = "GET"
    path = "/api/v1/health"
    interval = "20s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  FILESYSTEM_ROOT = "/tmp/agent-workspace"
  AGENT_API_INTERNAL_URL = "http://cloud-superbrain-agent-api.flycast:8000"
