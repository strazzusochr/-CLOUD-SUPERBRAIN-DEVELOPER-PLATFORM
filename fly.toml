app = "cloud-superbrain"
primary_region = "fra"

[build]
  dockerfile = "services/agent-api/Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[env]
  PORT = "8000"
  CLOUD_PROVIDER_INVENTORY_ENABLED = "true"
