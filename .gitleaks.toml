title = "Cloud Superbrain gitleaks config"

# Der gitleaks-Standardregelsatz ist Pflicht. Ohne ihn passieren GitHub-PATs,
# AWS-, OpenAI-, Slack-Tokens und PEM-Private-Keys den Scan ungesehen.
# Nachgemessen 2026-09-03 mit gitleaks 8.30.1: ohne diese Zeile meldet ein
# synthetisches, nicht stopword-basiertes ghp_-Muster "no leaks found". Mit
# useDefault=true wird dieselbe Positivkontrolle korrekt geblockt.
[extend]
useDefault = true

[[rules]]
id = "cloudflare-api-token"
description = "Cloudflare API token prefix"
regex = '''\bcfat_[A-Za-z0-9_-]{24,}\b'''
keywords = ["cfat_"]

[[rules]]
id = "vercel-token"
description = "Vercel token prefix"
regex = '''\bvck_[A-Za-z0-9_-]{24,}\b'''
keywords = ["vck_"]

[[rules]]
id = "huggingface-token"
description = "Hugging Face token prefix"
regex = '''\bhf_[A-Za-z0-9_-]{24,}\b'''
keywords = ["hf_"]

[[rules]]
id = "gitlab-personal-access-token"
description = "GitLab personal access token prefix"
regex = '''\bglpat-[A-Za-z0-9_.-]{20,}\b'''
keywords = ["glpat-"]

[[rules]]
id = "hcloud-token-line"
description = "Hetzner or hcloud token assignment"
regex = '''(?i)\b(hetzner|hcloud|cloud)\s+token\s+[A-Za-z0-9_-]{32,}\b'''
keywords = ["hetzner", "hcloud", "cloud"]

[[allowlists]]
description = "Allow documented placeholders only."
regexes = [
  '''change-me-now''',
  '''change-me-too''',
  '''PLACEHOLDER''',
  '''YOUR_KEY_HERE''',
  '''example\.invalid''',
  '''hf_router_snapshot_for_gateway_mode'''
]
paths = [
  '''\.env\.example$'''
]

# Nur die Heuristik "generic-api-key" wird in Beweisartefakten stummgeschaltet.
# Dort stehen SHA-256-Image-Digests, Git-SHAs und Build-Logs, die sie als
# Schluessel missdeutet - nachgemessen 79 Treffer, alle falsch.
# Jede echte Credential-Regel bleibt in diesen Pfaden aktiv.
[[allowlists]]
description = "Evidence artifacts contain digests, not credentials"
targetRules = ["generic-api-key"]
paths = [
  '''^docs/release-artifacts/''',
  '''^\.codex/runs/''',
  '''^\.phase1-artifacts/''',
  '''^apps/frontend/\.next/''',
  '''package-lock\.json$''',
  '''^services/cloudflare-stateful-runtime/''',
  '''/tests?/''',
  '''\.test\.(mjs|js|ts)$'''
]
# Ein reiner Hex-SHA ist niemals eine Zugangsberechtigung. Git-SHAs (40) und
# Image-Digests (64) tauchen in Wahrheitsdokumenten und Evidenz staendig auf.
regexes = [
  '''^[0-9a-f]{40}$''',
  '''^[0-9a-f]{64}$'''
]
