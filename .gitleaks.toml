title = "Cloud Superbrain gitleaks config"

[[rules]]
id = "cloudflare-api-token"
description = "Cloudflare API token prefix"
regex = '''\bcfat_[A-Za-z0-9_-]{24,}\b'''
keywords = ["cfat_"]

[[rules]]
id = "vercel-token"
description = "Vercel token prefix"
regex = '''\bvck_[A-Za-z0-9_-]{24,}\b'''
keywords = ["vck_"]

[[rules]]
id = "huggingface-token"
description = "Hugging Face token prefix"
regex = '''\bhf_[A-Za-z0-9_-]{24,}\b'''
keywords = ["hf_"]

[[rules]]
id = "gitlab-personal-access-token"
description = "GitLab personal access token prefix"
regex = '''\bglpat-[A-Za-z0-9_.-]{20,}\b'''
keywords = ["glpat-"]

[[rules]]
id = "hcloud-token-line"
description = "Hetzner or hcloud token assignment"
regex = '''(?i)\b(hetzner|hcloud|cloud)\s+token\s+[A-Za-z0-9_-]{32,}\b'''
keywords = ["hetzner", "hcloud", "cloud"]

[allowlist]
description = "Allow documented placeholders only."
regexes = [
  '''change-me-now''',
  '''change-me-too''',
  '''PLACEHOLDER''',
  '''YOUR_KEY_HERE''',
  '''example\.invalid'''
]
paths = [
  '''\.env\.example$'''
]
