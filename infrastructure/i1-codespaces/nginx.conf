log_format i1_path_only '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
access_log /dev/stdout i1_path_only;
error_log /dev/stderr warn;

map $http_x_forwarded_proto $i1_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

map $http_x_forwarded_host $i1_forwarded_host {
  default $http_x_forwarded_host;
  "" $host;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 2m;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $frontend http://frontend:3000;
  set $agent_api http://agent-api:8000;
  set $mcp_gateway http://mcp-gateway:9000;
  set $llm_gateway http://llm-gateway:4000;

  location = /__i1/health {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 200 '{"status":"healthy","service":"i1-same-origin-ingress"}\n';
  }

  location = /.well-known/cloud-superbrain/i1-provenance.json {
    alias /evidence/i1-provenance.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET HEAD { deny all; }
  }

  location /api/ {
    proxy_pass $agent_api;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $i1_forwarded_proto;
    proxy_set_header X-Forwarded-Host $i1_forwarded_host;
    proxy_set_header Connection "";
    proxy_hide_header X-Superbrain-Source;
    add_header X-Accel-Buffering "no" always;
    add_header X-Superbrain-Source "agent-api-boundary" always;
  }

  location ^~ /mcp/internal/ {
    return 404;
  }

  location /mcp/ {
    rewrite ^/mcp/(.*)$ /$1 break;
    proxy_pass $mcp_gateway;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Superbrain-Agent-Token "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $i1_forwarded_proto;
    proxy_set_header X-Forwarded-Host $i1_forwarded_host;
    proxy_hide_header Set-Cookie;
    add_header X-Accel-Buffering "no" always;
  }

  location /llm/ {
    rewrite ^/llm/(.*)$ /$1 break;
    proxy_pass $llm_gateway;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $i1_forwarded_proto;
    proxy_set_header X-Forwarded-Host $i1_forwarded_host;
    proxy_hide_header Set-Cookie;
    add_header X-Accel-Buffering "no" always;
  }

  location / {
    proxy_pass $frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $i1_forwarded_proto;
    proxy_set_header X-Forwarded-Host $i1_forwarded_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
