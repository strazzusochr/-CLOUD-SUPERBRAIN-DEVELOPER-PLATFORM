name: "sb-i1-${I1_SOURCE_SHA_SHORT:?set from verified publication manifest}"

x-app-runtime: &app-runtime
  pull_policy: always
  restart: unless-stopped
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=128m,mode=1777
  networks:
    - candidate

x-python-health: &python-health
  interval: 10s
  timeout: 5s
  retries: 18
  start_period: 20s

services:
  frontend:
    <<: *app-runtime
    image: "${I1_IMAGE_NAMESPACE:?required}/frontend@sha256:${I1_FRONTEND_DIGEST_HEX:?required}"
    environment:
      NEXT_PUBLIC_AGENT_API_URL: /api
      AGENT_API_INTERNAL_URL: http://agent-api:8000
      LLM_GATEWAY_BASE_URL: http://llm-gateway:4000
      MCP_GATEWAY_BASE_URL: http://mcp-gateway:9000
      SUPERBRAIN_RUNTIME_MODE: candidate-staging
      PRODUCT_ACCEPTANCE_LIVE_PROVIDER_APPROVED: "false"
      O4_LIVE_WRITE_PROBE_ENABLED: "false"
    expose:
      - "3000"
    depends_on:
      agent-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    mem_limit: 1024m
    cpus: "0.75"

  agent-api:
    <<: *app-runtime
    image: "${I1_IMAGE_NAMESPACE:?required}/agent-api@sha256:${I1_AGENT_API_DIGEST_HEX:?required}"
    environment:
      DATABASE_URL: postgresql://superbrain@postgres:5432/superbrain_prod
      REDIS_URL: redis://redis:6379/0
      MCP_GATEWAY_URL: http://mcp-gateway:9000
      LLM_GATEWAY_URL: http://llm-gateway:4000
      SUPERBRAIN_RUNTIME_MODE: candidate-staging
      LANGFUSE_ENABLED: "false"
      LLM_BUDGET_LIMIT_CENTS: "20000"
      LLM_BUDGET_WARNING_PERCENTAGE: "80"
      MAX_LLM_CALLS_PER_SESSION: "50"
      MEMORY_CONSOLIDATION_INTERVAL_SECONDS: "300"
      MEMORY_CONSOLIDATION_TTL_THRESHOLD_SECONDS: "480"
      WORKING_MEMORY_TTL_SECONDS: "1800"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-gateway:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
    healthcheck:
      <<: *python-health
      test: ["CMD", "python", "-c", "import json,urllib.request; p=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',timeout=3)); raise SystemExit(0 if p.get('status')=='healthy' else 1)"]
    mem_limit: 1024m
    cpus: "1.00"

  agent-worker:
    <<: *app-runtime
    image: "${I1_IMAGE_NAMESPACE:?required}/agent-worker@sha256:${I1_AGENT_WORKER_DIGEST_HEX:?required}"
    environment:
      DATABASE_URL: postgresql://superbrain@postgres:5432/superbrain_prod
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-api:
        condition: service_healthy
    healthcheck:
      <<: *python-health
      test: ["CMD", "python", "-c", "import os; os.kill(1,0)"]
    mem_limit: 512m
    cpus: "0.40"

  memory-worker:
    <<: *app-runtime
    image: "${I1_IMAGE_NAMESPACE:?required}/memory-worker@sha256:${I1_MEMORY_WORKER_DIGEST_HEX:?required}"
    environment:
      DATABASE_URL: postgresql://superbrain@postgres:5432/superbrain_prod
      REDIS_URL: redis://redis:6379/0
      AGENT_API_INTERNAL_URL: http://agent-api:8000
      LLM_GATEWAY_INTERNAL_URL: http://llm-gateway:4000
      MCP_GATEWAY_INTERNAL_URL: http://mcp-gateway:9000
      MEMORY_CONSOLIDATION_INTERVAL_SECONDS: "300"
      MEMORY_CONSOLIDATION_TTL_THRESHOLD_SECONDS: "480"
      WORKING_MEMORY_PATTERN: memory:working:*
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-api:
        condition: service_healthy
    healthcheck:
      <<: *python-health
      test: ["CMD", "python", "-c", "import os; os.kill(1,0)"]
    mem_limit: 512m
    cpus: "0.35"

  mcp-gateway:
    <<: *app-runtime
    image: "${I1_IMAGE_NAMESPACE:?required}/mcp-gateway@sha256:${I1_MCP_GATEWAY_DIGEST_HEX:?required}"
    environment:
      FILESYSTEM_ROOT: /tmp/agent-workspace
      AGENT_API_INTERNAL_URL: http://agent-api:8000
      LIVE_MCP_WRITES_ENABLED: "false"
      O4_LIVE_WRITE_PROBE_ENABLED: "false"
    expose:
      - "9000"
    volumes:
      - type: volume
        source: mcp_workspace
        target: /tmp/agent-workspace
    healthcheck:
      <<: *python-health
      test: ["CMD", "python", "-c", "import json,urllib.request; p=json.load(urllib.request.urlopen('http://127.0.0.1:9000/api/v1/health',timeout=3)); raise SystemExit(0 if p.get('status')=='healthy' else 1)"]
    mem_limit: 512m
    cpus: "0.50"

  llm-gateway:
    <<: *app-runtime
    image: "${I1_IMAGE_NAMESPACE:?required}/llm-gateway@sha256:${I1_LLM_GATEWAY_DIGEST_HEX:?required}"
    environment:
      AGENT_API_INTERNAL_URL: http://agent-api:8000
      LLM_GATEWAY_MODE: deterministic_dry_run
      LLM_LIVE_PROVIDER_DEFAULT: "false"
      LOCAL_LLM_ENABLED: "false"
    expose:
      - "4000"
    healthcheck:
      <<: *python-health
      test: ["CMD", "python", "-c", "import json,urllib.request; p=json.load(urllib.request.urlopen('http://127.0.0.1:4000/api/v1/health',timeout=3)); raise SystemExit(0 if p.get('status')=='healthy' and p.get('live_provider_calls') is False else 1)"]
    mem_limit: 512m
    cpus: "0.50"

  postgres:
    image: pgvector/pgvector:0.8.2-pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    pull_policy: always
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: superbrain
      POSTGRES_DB: superbrain_prod
      POSTGRES_HOST_AUTH_METHOD: trust
    expose:
      - "5432"
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=16m,mode=0775
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superbrain -d superbrain_prod"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s
    mem_limit: 1024m
    cpus: "0.75"
    networks:
      - candidate

  redis:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    pull_policy: always
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    expose:
      - "6379"
    volumes:
      - type: volume
        source: redis_data
        target: /data
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s
    mem_limit: 384m
    cpus: "0.25"
    networks:
      - candidate

  ingress:
    image: nginxinc/nginx-unprivileged:1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
    pull_policy: always
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    configs:
      - source: i1_ingress_config
        target: /etc/nginx/conf.d/default.conf
        mode: 0444
    volumes:
      - type: volume
        source: runtime_evidence
        target: /evidence
        read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=32m,mode=0755
    ports:
      - "127.0.0.1:${I1_INGRESS_PORT:-8080}:8080"
    depends_on:
      frontend:
        condition: service_healthy
      agent-api:
        condition: service_healthy
      mcp-gateway:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/__i1/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s
    mem_limit: 128m
    cpus: "0.20"
    networks:
      - candidate

  evidence-publisher:
    image: nginxinc/nginx-unprivileged:1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
    pull_policy: always
    profiles:
      - evidence
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - >-
        target=/evidence/i1-provenance.json;
        test ! -e "$$target";
        tmp="$${target}.tmp.$$$$";
        trap 'rm -f "$$tmp"' EXIT;
        umask 022;
        cat > "$$tmp";
        chmod 0444 "$$tmp";
        ln "$$tmp" "$$target";
        rm -f "$$tmp";
        trap - EXIT
    volumes:
      - type: volume
        source: runtime_evidence
        target: /evidence

configs:
  i1_ingress_config:
    file: ./nginx.conf

networks:
  candidate:
    internal: true

volumes:
  postgres_data:
  redis_data:
  mcp_workspace:
  runtime_evidence:
